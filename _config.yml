# Site settings
title: MATCH Lab
email: m.colley@ucl.ac.uk
description: "MATCH (Mobility, Accessibility, and Computational HCI) Lab & Friends, led by Dr. Mark Colley at the UCL Interaction Centre — HCI for accessible, trustworthy mobility."
tagline: "Mobility, Accessibility, and Computational HCI"
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://match-group.github.io" # the base hostname & protocol for your site, e.g. http://example.com
affiliation: We are part of the <a href="https://www.ucl.ac.uk/uclic" target="_blank">UCL Interaction Centre (UCLIC)</a>

# Google analytics ID — set to a real GA4 measurement id (G-XXXXXXX) to enable analytics.
# Left blank so no broken tracker is shipped; analytics.html would need updating to gtag.js/GA4.
# google_analytics: G-XXXXXXX

# Location info. (shown in footer)
location: >
  66-72 Gower St <br/>
  2. Floor <br/>
  WC1H 0AL <br/>
  London, UK <br/>
   

# Contact info. (shown in footer)
# contact: >



# Pages shown in navbar
nav_pages:

  - name: research
  - name: publications
  - name: team
  - name: news
  - name: about

# Do you want to group your publications by year? {true/false}
group_pub_by_year: true

include:
  - .htaccess
  - _pages

sass:
  sass_dir: _sass

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true
