name: Build check

# Validates that the site still builds (catches YAML/Liquid errors in content edits)
# before they reach the live site. Does NOT deploy — GitHub Pages still deploys from `main`.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jekyll-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install the GitHub Pages Jekyll environment
        run: gem install github-pages

      - name: Build the site (fails on YAML/Liquid errors)
        run: jekyll build --trace
        env:
          # Build with the gem-installed GitHub Pages environment, not the repo Gemfile/Bundler.
          JEKYLL_NO_BUNDLER_REQUIRE: "true"
