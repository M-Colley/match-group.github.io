- date: "April 2026"
  headline: 'Mark was selected as a <a href="https://www.absw.org.uk/pages/absw-media-fellowships" target="_blank" rel="noopener">2026 ABSW Media Fellow</a>. Supported by UCL, he will spend several weeks embedded in a major UK media outlet, working with science journalists to communicate HCI and future-mobility research to a broader audience.'

- date: "February 2026"
  headline: "Mark is a Visiting Professor at the University of Tokyo, supported by the Canon Foundation Research Fellowship, in Takeo Igarashi's User Interface Research Group."

- date: "January 2026"
  headline: 'Mark joined the ACM Transactions on Computer-Human Interaction (TOCHI) Distinguished Reviewer Board, and 10 co-authored papers were conditionally accepted to CHI&rsquo;26 — see you in Barcelona!'

- date: "December 2025"
  headline: "Mark was a Visiting Professor at TU Eindhoven, supported by the Eindhoven Artificial Intelligence Systems Institute (EAISI) Visiting Professors Scholarship."

- date: "November 2025"
  headline: "Mark became a Fellow of the Higher Education Academy (FHEA) and gave invited talks at World Usability Day Ingolstadt and the Huawei UX Design Technology Conference (UXTC) in Lund."

- date: "2025"
  headline: "The group received multiple paper awards in 2025: Best Paper (AutoUI), Best Blue Sky Vision Paper (ICMI), Best Paper (WISS), and an Honorable Mention (MUM)."

- date: "2025"
